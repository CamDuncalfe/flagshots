# Self-hosted Flagsmith for local development.
#   docker compose up -d     starts Postgres and Flagsmith on http://localhost:8000
#   docker compose down      stops them (add -v to wipe the database)
#
# The Flagsmith version is pinned so the API calls in src/ keep matching it.

name: flagshots

x-flagsmith-env: &flagsmith-env
  DATABASE_URL: postgresql://postgres:password@postgres:5432/flagsmith
  USE_POSTGRES_FOR_ANALYTICS: 'true'
  DJANGO_ALLOWED_HOSTS: '*'
  FLAGSMITH_DOMAIN: localhost:8000
  DJANGO_SECRET_KEY: local-development-only
  WAREHOUSE_CREDENTIALS_SECRET: local-development-only
  EXPERIMENTATION_ENABLED: 'true'
  # Run background tasks inside the API process, so no task processor container is needed.
  TASK_RUN_METHOD: SYNCHRONOUSLY

services:
  postgres:
    image: postgres:15.5-alpine
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flagsmith
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d flagsmith -U postgres']
      interval: 2s
      timeout: 2s
      retries: 30

  flagsmith:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.294.0
    # The image's default command runs the database migrations, then serves the API and dashboard.
    command: migrate-and-serve
    environment:
      <<: *flagsmith-env
    ports:
      - 8000:8000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
